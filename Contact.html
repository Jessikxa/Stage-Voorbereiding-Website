<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Stage Website</title>
</head>

<body>
    <header >
        <div class="Header">
            <a href="HomePage.html">Home</a>
            <a href="AboutMe.html">About Us</a>
            <a href="Services.html">Services</a>
            <a href="Projects.html">Projects</a>
            <a href="Contact.html">Contact</a>
        </div>
        
    </header>

    <main>
        <div class="ContactForm">
             <h1>Contact</h1>

            <form action="" class="form">

                <p>First Name</p>
                <input type="text" id="First-Name" required> <br>
                <p>Last Name</p>
                <input type="text" name="Last-Name" id="Last-Name" required> <br>
                <p>Email</p>
                <input type="email" name="User-Email" id="Email" required><br>
                
                <P>Budget</P>
                <div class="Budget" required>
                    <input type="text" value="€" autofocus="autofocus" id="Budget" required> 
                    <span class="unit" ></span>
                    
                </div> <br>

                <label for="Services">Choose your service</label> <br>
                <select name="Service" id="Service" required>
                    <option value="New Build">New Build project</option>
                    <option value="Remodel">Remodel project</option>
                    <option value="One Room">one room project</option>
                </select> <br>

                <p>Do you want to receive marketing emails?</p>
                <input type="checkbox"><br> <br>
                <input type="submit" class="submitForm">
                
            </form>
        </div>
    </main>

    <footer></footer>
</body>

</html>
